services:
  deepseek-bridge:
    build:
      context: .
      args:
        MUSE_BUILD_REVISION: ${MUSE_BUILD_REVISION:-unknown}
    environment:
      MUSE_MAX_PROMPT_CHARS: ${MUSE_MAX_PROMPT_CHARS:-100000}
      MUSE_URL: https://chat.deepseek.com/
      MUSE_VNC_URL: http://127.0.0.1:4338/vnc.html?autoconnect=1&resize=scale&host=127.0.0.1&port=4338&path=websockify
      MUSE_REQUEST_TIMEOUT_MS: ${MUSE_REQUEST_TIMEOUT_MS:-420000}
    image: deepseek-opencode-bridge:local
    container_name: deepseek-opencode-bridge
    init: true
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "127.0.0.1:4337:4317"
      - "127.0.0.1:4338:7900"
    volumes:
      - deepseek-bridge-data:/data

volumes:
  deepseek-bridge-data:
    name: deepseek-opencode-bridge-data
