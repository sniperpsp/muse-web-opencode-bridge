services:
  muse-bridge:
    build:
      context: .
      args:
        MUSE_BUILD_REVISION: ${MUSE_BUILD_REVISION:-unknown}
    environment:
      MUSE_MAX_PROMPT_CHARS: ${MUSE_MAX_PROMPT_CHARS:-60000}
      MUSE_REQUEST_TIMEOUT_MS: ${MUSE_REQUEST_TIMEOUT_MS:-180000}
      MUSE_HISTORY_CHARS: ${MUSE_HISTORY_CHARS:-150000}
      MUSE_MAX_TABS: ${MUSE_MAX_TABS:-1}
      MUSE_ROTATE_TURNS: ${MUSE_ROTATE_TURNS:-40}
      MUSE_ROTATE_CHARS: ${MUSE_ROTATE_CHARS:-300000}
    image: muse-opencode-bridge:local
    container_name: muse-opencode-bridge
    init: true
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:7900"
    volumes:
      - muse-bridge-data:/data

volumes:
  muse-bridge-data:
    external: true
    name: muse-opencode-bridge-data
